name: Sync to ibeckett.com

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "games.json"
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lotto-scraper
        uses: actions/checkout@v4

      - name: Checkout ibeckett.com
        uses: actions/checkout@v4
        with:
          repository: ianbeckett/ibeckett.com
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: Copy files into lotto-scraper/ subfolder
        run: |
          mkdir -p site/lotto-scraper
          cp index.html site/lotto-scraper/index.html
          cp games.json site/lotto-scraper/games.json

      - name: Commit and push
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lotto-scraper
          git diff --quiet --cached || git commit -m "Sync lotto-scraper from ianbeckett/lotto-scraper"
          git push
