name: Scrape WA Lottery Data

on:
  schedule:
    # Hourly, on the :00. WA Lottery's numbers don't update that often, but
    # this keeps us close without hammering a small state site with no API.
    - cron: '0 * * * *'
  workflow_dispatch: {}   # lets you trigger a manual re-scrape from the Actions tab

permissions:
  contents: write

concurrency:
  # Shared with scrape-oregon.yml's "scrape" job (same group name) - see
  # the comment there for why. cancel-in-progress: false means an
  # overlapping trigger waits its turn instead of being dropped.
  group: games-json-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --quiet --cached || git commit -m "Update scratch ticket data ($(date -u +%Y-%m-%d))"
          git push

  sync:
    needs: scrape
    uses: ./.github/workflows/sync-to-site.yml
    secrets: inherit
